# Virtual workspace root: the shared runtime and its adapters resolve together.
# Models are deliberately NOT members: each keeps its own lock so a CPU-only and a
# CUDA deployment can coexist without one dictating the other's torch build.

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["models/*"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
docs = [
    "sphinx>=8,<9",
    "sphinx-rtd-theme>=3,<4",
    "myst-parser>=4,<5",
    "sphinx-copybutton>=0.5,<1",
    "matplotlib>=3.8,<4",
]

# No torch index here: the runtime depends on no framework, so each model
# declares its own build in its own project.

# One lint configuration for every package and model; ruff discovers it by walking up.
[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party source is kept byte-identical to upstream so it can
# still be diffed against it. Reformatting it would make that impossible.
extend-exclude = ["**/_vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Declared explicitly: running from the workspace root, ruff cannot infer these
# from a src layout the way it does inside each project.
[tool.ruff.lint.isort]
known-first-party = ["nowcast_runtime", "inceptionv4_nowcast"]

[tool.pytest.ini_options]
testpaths = ["packages/nowcast-runtime/tests"]
