[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inceptionv4-nowcast"
version = "0.1.0"
description = "GSMaP NOW to GeoTIFF using a direct InceptionV4 forecaster"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nowcast-runtime",
    "numpy>=1.26,<3",
    "rasterio>=1.4,<2",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==1.0.25",
]

[project.scripts]
inceptionv4-nowcast = "inceptionv4_nowcast.entrypoint:main"
inceptionv4-serve = "inceptionv4_nowcast.entrypoint:serve"
inceptionv4-download-artifacts = "nowcast_runtime.download_artifacts:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Path dependency while the ports are still moving; swap for a pinned version from
# an index once they stabilize, without touching any other file.
nowcast-runtime = { path = "../../packages/nowcast-runtime", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/inceptionv4_nowcast"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/config", "/tools", "/deploy",
    "/artifacts/v1/manifest.json",
    "/artifacts/v1/gsmap_nrt+mvk_log_mean_ainpp-latin-america.npy",
    "/artifacts/v1/gsmap_nrt+mvk_log_std_ainpp-latin-america.npy",
    "/Dockerfile", "/compose.yaml", "/.dockerignore",
    "/README.md", "/VALIDATION.md", "/pyproject.toml", "/uv.lock",
]
exclude = ["/deploy/generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
